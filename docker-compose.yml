services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: archivist
      POSTGRES_PASSWORD: archivist
      POSTGRES_DB: archivist
    ports:
      - "51214:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archivist -d archivist"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./apps/api
      dockerfile: infra/dev/Dockerfile
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://archivist:archivist@db:5432/archivist
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
